name: Diagnostico Painel Observabilidade (temporario)

# Descartavel — chama os 3 endpoints novos contra a API real para confirmar
# que o deploy funciona de ponta a ponta antes de reportar sucesso.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar os 3 endpoints
        env:
          API_KEYS: ${{ secrets.API_KEYS }}
        run: |
          API_URL="https://taxreformai-api-as2g43xasa-rj.a.run.app"
          CHAVE=$(echo "$API_KEYS" | jq -r 'keys[0]')

          for rota in status custo scorecard; do
            echo "=== /v1/observabilidade/$rota ==="
            HTTP=$(curl -sS -o /tmp/resp.json -w '%{http_code}' --max-time 20 \
              -X GET "$API_URL/v1/observabilidade/$rota" -H "X-API-Key: ${CHAVE}")
            echo "HTTP=$HTTP"
            cat /tmp/resp.json
            echo ""
          done
