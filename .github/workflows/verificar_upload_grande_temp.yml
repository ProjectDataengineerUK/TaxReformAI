name: Verificar Upload Grande (temporario, FILA_ASSINCRONA_CELERY_REDIS)

# Descartavel: existe so para medir o tempo real de processamento de
# 50.000+ linhas contra a API ja deployada (AT-006 do DEFINE), sem precisar
# de outro build+deploy. Sera removido apos a verificacao.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite exatamente "VERIFICAR" para confirmar'
        required: true
        default: ""
      linhas:
        description: "Numero de linhas do CSV de teste"
        required: true
        default: "55000"

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Guarda de confirmacao
        if: ${{ inputs.confirm != 'VERIFICAR' }}
        run: |
          echo 'confirm != "VERIFICAR". Nada foi executado.'
          exit 1

      - name: Gerar CSV grande e fazer upload real
        env:
          API_KEYS: ${{ secrets.API_KEYS }}
          API_URL: https://taxreformai-api-as2g43xasa-rj.a.run.app
          LINHAS: ${{ inputs.linhas }}
        run: |
          set -euo pipefail
          CHAVE=$(echo "$API_KEYS" | jq -r 'keys[0]')
          TENANT=$(echo "$API_KEYS" | jq -r --arg k "$CHAVE" '.[$k]')

          echo "codigo_sku,descricao,natureza,ncm_code,nbs_code" > /tmp/grande.csv
          seq 1 "$LINHAS" | awk '{printf "SMOKE-50K-%d,Produto de teste de volume %d,MERCADORIA,22030000,\n", $1, $1}' >> /tmp/grande.csv
          wc -l /tmp/grande.csv

          INICIO=$(date +%s)
          HTTP=$(curl -sS -o /tmp/upload_grande.json -w '%{http_code}' --max-time 60 \
            -X POST "${API_URL}/v1/tax/skus/upload" \
            -H "X-API-Key: ${CHAVE}" \
            -F "arquivo=@/tmp/grande.csv;type=text/csv")
          if [ "$HTTP" != "202" ]; then
            echo "FALHA: POST /v1/tax/skus/upload devolveu $HTTP (esperado 202)."
            cat /tmp/upload_grande.json
            exit 1
          fi
          JOB_ID=$(jq -r '.job_id' /tmp/upload_grande.json)
          echo "Job criado: $JOB_ID"

          JOB_STATUS="PENDENTE"
          for _ in $(seq 1 120); do
            HTTP=$(curl -sS -o /tmp/job_grande.json -w '%{http_code}' --max-time 30 \
              -X GET "${API_URL}/v1/tax/skus/upload/${JOB_ID}" -H "X-API-Key: ${CHAVE}")
            JOB_STATUS=$(jq -r '.status' /tmp/job_grande.json)
            echo "status atual: $JOB_STATUS ($(( $(date +%s) - INICIO ))s decorridos)"
            if [ "$JOB_STATUS" = "CONCLUIDO" ] || [ "$JOB_STATUS" = "ERRO" ]; then
              break
            fi
            sleep 10
          done
          FIM=$(date +%s)
          DURACAO=$((FIM - INICIO))

          echo "=== RESULTADO ==="
          echo "linhas=$LINHAS status_final=$JOB_STATUS duracao_segundos=$DURACAO"
          if [ "$JOB_STATUS" != "CONCLUIDO" ]; then
            echo "FALHA: job não concluiu (status=$JOB_STATUS) em $DURACAO segundos."
            cat /tmp/job_grande.json
            exit 1
          fi
          jq '.resultado | {total_linhas, criados, atualizados, erros}' /tmp/job_grande.json
          echo "OK: $LINHAS linhas processadas em ${DURACAO}s"
          echo "Limpeza NÃO automática — as ~$LINHAS linhas SMOKE-50K-* ficam no catálogo"
          echo "de teste (custo de armazenamento desprezível); apagar manualmente se quiser."
