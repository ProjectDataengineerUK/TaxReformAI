name: Migrar Banco de Dados

# Nunca dispara automaticamente: altera schema de um banco com dados de
# cliente (mesmo padrão de guarda explícita de deploy.yml e terraform.yml).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite exatamente "MIGRAR" para confirmar'
        required: true
        default: ""
      verificar_rls:
        description: "Provar isolamento de RLS contra o banco real após migrar (cria e apaga 2 tenants de teste)"
        required: true
        default: "sim"
        type: choice
        options:
          - "sim"
          - "nao"
      ingerir_tipi:
        description: "Baixar a TIPI oficial da RFB e gravar as ~9200 alíquotas de IPI por NCM"
        required: true
        default: "sim"
        type: choice
        options:
          - "sim"
          - "nao"
      verificar_ipi:
        description: "Provar que o papel de RUNTIME (taxreformai_app) lê aliquotas_ipi_tipi — o GRANT da migração 004 nunca foi exercitado"
        required: true
        default: "sim"
        type: choice
        options:
          - "sim"
          - "nao"
      verificar_reducao:
        description: "Provar que o papel de RUNTIME lê os 10 Anexos de redução (4 a zero + 6 percentuais), incluindo a precedência normativa e a condição de comprador"
        required: true
        default: "sim"
        type: choice
        options:
          - "sim"
          - "nao"
      verificar_reducao_nbs:
        description: "Provar que o papel de RUNTIME lê os Anexos de redução por NBS (II, III, XI — Anexo X ainda sem itens), incluindo o desempate de 11 itens do mesmo código e os dois eixos de condição do Anexo XI"
        required: true
        default: "sim"
        type: choice
        options:
          - "sim"
          - "nao"
      verificar_imposto_seletivo:
        description: "Provar que o papel de RUNTIME lê a base de incidência do Imposto Seletivo (Anexo XVII), incluindo a condição de embalagem primária e a exceção de código 8802.60.00"
        required: true
        default: "sim"
        type: choice
        options:
          - "sim"
          - "nao"
      verificar_empresa_skus:
        description: "Provar que o papel de RUNTIME consegue ESCREVER em empresa_skus com RLS aplicado (criar/consultar/listar/atualizar/upsert/excluir) — primeira feature de CRUD de escrita desde SCHEMA_POSTGRESQL"
        required: true
        default: "sim"
        type: choice
        options:
          - "sim"
          - "nao"

env:
  PYTHONPATH: ${{ github.workspace }}
  INSTANCE_CONNECTION_NAME: taxreformai-dev:southamerica-east1:taxreformai-pg

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - name: Guarda de confirmação
        if: ${{ inputs.confirm != 'MIGRAR' }}
        run: |
          echo 'confirm != "MIGRAR". Nada foi executado contra o banco.'
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # pdftotext, só necessário quando ingerir_tipi=sim — mas instalar sempre
      # é mais simples que condicionar um apt-get, e o custo é baixo.
      - name: Instalar poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # GCP_SA_KEY é a SA do Terraform (roles/cloudsql.admin + secretmanager.admin
      # desde a feature do schema), reaproveitada aqui: admin implica
      # cloudsql.instances.connect, e este workflow já é tratado como operação
      # administrativa (mesmo padrão de terraform.yml). A senha vem direto do
      # Secret Manager em vez de duplicada como secret do GitHub — uma fonte
      # de verdade só, a mesma que o Terraform gravou.
      - name: Ler senha do admin no Secret Manager
        run: |
          echo "PG_ADMIN_PASSWORD=$(gcloud secrets versions access latest --secret=taxreformai-pg-admin-password --project=taxreformai-dev)" >> "$GITHUB_ENV"

      - name: Baixar Cloud SQL Auth Proxy
        run: |
          curl -sSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.23.0/cloud-sql-proxy.linux.amd64
          echo "cd689d582b826fa5bc82c01ccc14e45a58200c3cefbf923ce96c422825e4e6f6  cloud-sql-proxy" | sha256sum -c -
          chmod +x cloud-sql-proxy

      - name: Iniciar o proxy em background
        run: |
          ./cloud-sql-proxy --port 5432 "$INSTANCE_CONNECTION_NAME" &
          echo "PROXY_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null && exit 0
            sleep 1
          done
          echo "Proxy não abriu a porta 5432 em 30s."
          exit 1

      - name: Aplicar migrações (papel admin)
        run: |
          export DATABASE_URL="postgresql://taxreformai_admin:${PG_ADMIN_PASSWORD}@127.0.0.1:5432/taxreformai"
          python scripts/aplicar_migracoes.py

      # Sem isto, resolver_tenant() nunca encontra o tenant "taxreformai-dev"
      # que a API já usa hoje, e todo audit log real logaria "não cadastrado".
      - name: Popular tenants a partir de API_KEYS
        env:
          API_KEYS: ${{ secrets.API_KEYS }}
        run: |
          export DATABASE_URL="postgresql://taxreformai_admin:${PG_ADMIN_PASSWORD}@127.0.0.1:5432/taxreformai"
          python scripts/popular_tenants.py

      # TIPI é dado tabular público (Decreto 11.158/2022), não legislação com
      # hierarquia de artigos — vai para o Postgres, não para o Qdrant. ~9200
      # códigos NCM, upsert idempotente (reingerir atualiza, não duplica).
      - name: Ingerir tabela TIPI (IPI por NCM)
        if: ${{ inputs.ingerir_tipi == 'sim' }}
        run: |
          export DATABASE_URL="postgresql://taxreformai_admin:${PG_ADMIN_PASSWORD}@127.0.0.1:5432/taxreformai"
          python scripts/ingerir_tipi.py

      # Prova RLS contra o Cloud SQL real, não só infere do diagnóstico de
      # atributos: cria 2 tenants de teste, grava um parecer para cada,
      # confirma isolamento, apaga tudo.
      - name: Verificar isolamento de RLS
        if: ${{ inputs.verificar_rls == 'sim' }}
        run: |
          export DATABASE_URL="postgresql://taxreformai_admin:${PG_ADMIN_PASSWORD}@127.0.0.1:5432/taxreformai"
          python scripts/verificar_rls_producao.py

      # Pela Decisão 2 do DESIGN de IPI_TIPI_MOTOR_CALCULO, um GRANT faltando
      # NÃO produz erro em runtime: produz CONSULTA_INDISPONIVEL silencioso na
      # resposta de /v1/tax/simulate. Este passo é o único lugar em que isso
      # falha ruidosamente — e usa a senha do papel APP, não a do admin, porque
      # a pergunta é "a API consegue ler?", não "o dado existe?".
      - name: Verificar leitura de IPI pelo papel de runtime
        if: ${{ inputs.verificar_ipi == 'sim' }}
        run: |
          PG_APP_PASSWORD=$(gcloud secrets versions access latest --secret=taxreformai-pg-app-password --project=taxreformai-dev)
          export DATABASE_URL_APP="postgresql://taxreformai_app:${PG_APP_PASSWORD}@127.0.0.1:5432/taxreformai"
          python scripts/verificar_ipi_producao.py

      # Mesmo modo de falha silencioso da verificação acima, e pior: pela
      # degradação conservadora dos Anexos de alíquota zero, um GRANT faltando
      # faz a redução simplesmente não ser aplicada — 200, verde, e com a
      # alíquota geral, que é EXATAMENTE a resposta de antes da feature. Este
      # passo é o único lugar em que a diferença entre "funciona" e "não faz
      # nada" aparece.
      #
      # Depois das migrações 007/008 (Anexo I + XII/XIII/XV) e 009/010 (catálogo
      # + Anexos IV/V/VI/VII/VIII/IX), são 14 casos: 7 de não-regressão dos
      # Anexos zero e 7 dos mecanismos novos — precedência normativa (Anexo I/XV
      # sobre o VII), multi-capítulo e a condição de comprador dos Anexos
      # IV/V/VI, que podem falhar sozinhos sem afetar os Anexos zero.
      - name: Verificar leitura dos Anexos de redução pelo papel de runtime
        if: ${{ inputs.verificar_reducao == 'sim' }}
        run: |
          PG_APP_PASSWORD=$(gcloud secrets versions access latest --secret=taxreformai-pg-app-password --project=taxreformai-dev)
          export DATABASE_URL_APP="postgresql://taxreformai_app:${PG_APP_PASSWORD}@127.0.0.1:5432/taxreformai"
          python scripts/verificar_reducao_producao.py

      # Primeiro vocabulário do projeto por NBS, não por NCM/SH — tabelas
      # NOVAS (anexos_reducao_nbs/anexos_reducao_nbs_prefixo), GRANT NUNCA
      # exercitado antes deste passo. Mesmo modo de falha silencioso: sem o
      # GRANT, a API responde 200 com a alíquota geral, indistinguível de
      # sucesso. O Anexo X é verificado como estando VAZIO de propósito (gap
      # documentado no BUILD_REPORT desta feature, não regressão).
      - name: Verificar leitura dos Anexos de redução por NBS pelo papel de runtime
        if: ${{ inputs.verificar_reducao_nbs == 'sim' }}
        run: |
          PG_APP_PASSWORD=$(gcloud secrets versions access latest --secret=taxreformai-pg-app-password --project=taxreformai-dev)
          export DATABASE_URL_APP="postgresql://taxreformai_app:${PG_APP_PASSWORD}@127.0.0.1:5432/taxreformai"
          python scripts/verificar_reducao_nbs_producao.py

      # Primeira feature do projeto sobre um tributo DIFERENTE (Imposto
      # Seletivo, não CBS/IBS) — tabelas NOVAS (imposto_seletivo_incidencia/
      # _ncm), GRANT nunca exercitado antes deste passo. Mesmo modo de falha
      # silencioso: sem o GRANT, o item simplesmente não é classificado
      # (CONSULTA_INDISPONIVEL), sem afetar CBS/IBS/IPI.
      - name: Verificar leitura da base de incidência do Imposto Seletivo pelo papel de runtime
        if: ${{ inputs.verificar_imposto_seletivo == 'sim' }}
        run: |
          PG_APP_PASSWORD=$(gcloud secrets versions access latest --secret=taxreformai-pg-app-password --project=taxreformai-dev)
          export DATABASE_URL_APP="postgresql://taxreformai_app:${PG_APP_PASSWORD}@127.0.0.1:5432/taxreformai"
          python scripts/verificar_imposto_seletivo_producao.py

      # Primeira feature do projeto com CRUD de escrita desde SCHEMA_POSTGRESQL
      # — toda feature anterior só LIA tabela pública de referência. O risco
      # aqui não é "GRANT faltando degrada em silêncio" (como as verificações
      # acima), é "RLS de ESCRITA falha e o dado de um tenant vaza/mistura com
      # o de outro" — por isso o script cria um tenant real e exercita as 6
      # operações via db/repositorio.py, não SQL ad-hoc. Precisa de DATABASE_URL
      # (admin, só para criar/apagar o tenant de teste) além de DATABASE_URL_APP
      # (papel de runtime, que faz todo o CRUD de fato).
      - name: Verificar escrita em empresa_skus pelo papel de runtime
        if: ${{ inputs.verificar_empresa_skus == 'sim' }}
        run: |
          export DATABASE_URL="postgresql://taxreformai_admin:${PG_ADMIN_PASSWORD}@127.0.0.1:5432/taxreformai"
          PG_APP_PASSWORD=$(gcloud secrets versions access latest --secret=taxreformai-pg-app-password --project=taxreformai-dev)
          export DATABASE_URL_APP="postgresql://taxreformai_app:${PG_APP_PASSWORD}@127.0.0.1:5432/taxreformai"
          python scripts/verificar_empresa_skus_producao.py

      - name: Encerrar o proxy
        if: always()
        run: kill "$PROXY_PID" 2>/dev/null || true
