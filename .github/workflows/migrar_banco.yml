name: Migrar Banco de Dados

# Nunca dispara automaticamente: altera schema de um banco com dados de
# cliente (mesmo padrão de guarda explícita de deploy.yml e terraform.yml).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite exatamente "MIGRAR" para confirmar'
        required: true
        default: ""
      verificar_rls:
        description: "Provar isolamento de RLS contra o banco real após migrar (cria e apaga 2 tenants de teste)"
        required: true
        default: "sim"
        type: choice
        options:
          - "sim"
          - "nao"
      ingerir_tipi:
        description: "Baixar a TIPI oficial da RFB e gravar as ~9200 alíquotas de IPI por NCM"
        required: true
        default: "sim"
        type: choice
        options:
          - "sim"
          - "nao"
      verificar_ipi:
        description: "Provar que o papel de RUNTIME (taxreformai_app) lê aliquotas_ipi_tipi — o GRANT da migração 004 nunca foi exercitado"
        required: true
        default: "sim"
        type: choice
        options:
          - "sim"
          - "nao"
      verificar_cesta_basica:
        description: "Provar que o papel de RUNTIME lê o Anexo I (Cesta Básica) e que as exceções dos itens 19/20 são respeitadas"
        required: true
        default: "sim"
        type: choice
        options:
          - "sim"
          - "nao"

env:
  PYTHONPATH: ${{ github.workspace }}
  INSTANCE_CONNECTION_NAME: taxreformai-dev:southamerica-east1:taxreformai-pg

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - name: Guarda de confirmação
        if: ${{ inputs.confirm != 'MIGRAR' }}
        run: |
          echo 'confirm != "MIGRAR". Nada foi executado contra o banco.'
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # pdftotext, só necessário quando ingerir_tipi=sim — mas instalar sempre
      # é mais simples que condicionar um apt-get, e o custo é baixo.
      - name: Instalar poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # GCP_SA_KEY é a SA do Terraform (roles/cloudsql.admin + secretmanager.admin
      # desde a feature do schema), reaproveitada aqui: admin implica
      # cloudsql.instances.connect, e este workflow já é tratado como operação
      # administrativa (mesmo padrão de terraform.yml). A senha vem direto do
      # Secret Manager em vez de duplicada como secret do GitHub — uma fonte
      # de verdade só, a mesma que o Terraform gravou.
      - name: Ler senha do admin no Secret Manager
        run: |
          echo "PG_ADMIN_PASSWORD=$(gcloud secrets versions access latest --secret=taxreformai-pg-admin-password --project=taxreformai-dev)" >> "$GITHUB_ENV"

      - name: Baixar Cloud SQL Auth Proxy
        run: |
          curl -sSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.23.0/cloud-sql-proxy.linux.amd64
          echo "cd689d582b826fa5bc82c01ccc14e45a58200c3cefbf923ce96c422825e4e6f6  cloud-sql-proxy" | sha256sum -c -
          chmod +x cloud-sql-proxy

      - name: Iniciar o proxy em background
        run: |
          ./cloud-sql-proxy --port 5432 "$INSTANCE_CONNECTION_NAME" &
          echo "PROXY_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null && exit 0
            sleep 1
          done
          echo "Proxy não abriu a porta 5432 em 30s."
          exit 1

      - name: Aplicar migrações (papel admin)
        run: |
          export DATABASE_URL="postgresql://taxreformai_admin:${PG_ADMIN_PASSWORD}@127.0.0.1:5432/taxreformai"
          python scripts/aplicar_migracoes.py

      # Sem isto, resolver_tenant() nunca encontra o tenant "taxreformai-dev"
      # que a API já usa hoje, e todo audit log real logaria "não cadastrado".
      - name: Popular tenants a partir de API_KEYS
        env:
          API_KEYS: ${{ secrets.API_KEYS }}
        run: |
          export DATABASE_URL="postgresql://taxreformai_admin:${PG_ADMIN_PASSWORD}@127.0.0.1:5432/taxreformai"
          python scripts/popular_tenants.py

      # TIPI é dado tabular público (Decreto 11.158/2022), não legislação com
      # hierarquia de artigos — vai para o Postgres, não para o Qdrant. ~9200
      # códigos NCM, upsert idempotente (reingerir atualiza, não duplica).
      - name: Ingerir tabela TIPI (IPI por NCM)
        if: ${{ inputs.ingerir_tipi == 'sim' }}
        run: |
          export DATABASE_URL="postgresql://taxreformai_admin:${PG_ADMIN_PASSWORD}@127.0.0.1:5432/taxreformai"
          python scripts/ingerir_tipi.py

      # Prova RLS contra o Cloud SQL real, não só infere do diagnóstico de
      # atributos: cria 2 tenants de teste, grava um parecer para cada,
      # confirma isolamento, apaga tudo.
      - name: Verificar isolamento de RLS
        if: ${{ inputs.verificar_rls == 'sim' }}
        run: |
          export DATABASE_URL="postgresql://taxreformai_admin:${PG_ADMIN_PASSWORD}@127.0.0.1:5432/taxreformai"
          python scripts/verificar_rls_producao.py

      # Pela Decisão 2 do DESIGN de IPI_TIPI_MOTOR_CALCULO, um GRANT faltando
      # NÃO produz erro em runtime: produz CONSULTA_INDISPONIVEL silencioso na
      # resposta de /v1/tax/simulate. Este passo é o único lugar em que isso
      # falha ruidosamente — e usa a senha do papel APP, não a do admin, porque
      # a pergunta é "a API consegue ler?", não "o dado existe?".
      - name: Verificar leitura de IPI pelo papel de runtime
        if: ${{ inputs.verificar_ipi == 'sim' }}
        run: |
          PG_APP_PASSWORD=$(gcloud secrets versions access latest --secret=taxreformai-pg-app-password --project=taxreformai-dev)
          export DATABASE_URL_APP="postgresql://taxreformai_app:${PG_APP_PASSWORD}@127.0.0.1:5432/taxreformai"
          python scripts/verificar_ipi_producao.py

      # Mesmo modo de falha silencioso da verificação acima, e pior: pela
      # Decisão 8 do DESIGN da Cesta Básica, um GRANT faltando faz a redução do
      # art. 125 simplesmente não ser aplicada — 200, verde, e com a alíquota
      # geral, que é EXATAMENTE a resposta de antes da feature. Este passo é o
      # único lugar em que a diferença entre "funciona" e "não faz nada" aparece.
      - name: Verificar leitura da Cesta Básica (Anexo I) pelo papel de runtime
        if: ${{ inputs.verificar_cesta_basica == 'sim' }}
        run: |
          PG_APP_PASSWORD=$(gcloud secrets versions access latest --secret=taxreformai-pg-app-password --project=taxreformai-dev)
          export DATABASE_URL_APP="postgresql://taxreformai_app:${PG_APP_PASSWORD}@127.0.0.1:5432/taxreformai"
          python scripts/verificar_cesta_basica_producao.py

      - name: Encerrar o proxy
        if: always()
        run: kill "$PROXY_PID" 2>/dev/null || true
