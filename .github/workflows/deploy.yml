name: Deploy Cloud Run

# Nunca dispara automaticamente: deploy cria recursos cobráveis e sobe código
# para a internet. Mesmo padrão de guarda explícita já usado por terraform.yml.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "O que deployar"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - api
          - frontend
      confirm:
        description: 'Digite exatamente "DEPLOY" para confirmar'
        required: true
        default: ""

env:
  REGION: southamerica-east1
  SERVICE_API: taxreformai-api
  SERVICE_FRONTEND: taxreformai-frontend
  CLOUDSQL_CONNECTION_NAME: taxreformai-dev:southamerica-east1:taxreformai-pg
  # `python scripts/x.py` põe scripts/ no sys.path, não a raiz do repo — sem
  # isto, "Verificar que o audit log foi gravado de verdade" quebraria com
  # ModuleNotFoundError ao importar db.repositorio (mesmo bug já corrigido em
  # ingestao.yml).
  PYTHONPATH: ${{ github.workspace }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Guarda de confirmação
        if: ${{ inputs.confirm != 'DEPLOY' }}
        run: |
          echo "confirm != 'DEPLOY'. Nenhuma imagem foi publicada e nenhum serviço alterado."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Só psycopg[binary], não `-r requirements.txt`: este job builda imagens
      # Docker, não roda a suíte de testes — puxar fastembed/onnxruntime/
      # qdrant-client aqui seria peso sem uso, só para um script que faz um
      # SELECT.
      - name: Instalar psycopg (para a verificação do audit log)
        run: pip install "psycopg[binary]>=3.2"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_DEPLOYER_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Definir repositório de imagens
        run: |
          echo "IMAGE_REPO=${REGION}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/taxreformai" >> "$GITHUB_ENV"
          # Identidade de runtime dos serviços (sem permissão nenhuma, ver
          # infra/terraform/main.tf). Sem --service-account o Cloud Run usa a SA
          # de compute padrão, e a SA de deploy não tem actAs sobre ela — foi
          # exatamente assim que o primeiro deploy real falhou.
          echo "RUNTIME_SA=taxreformai-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" >> "$GITHUB_ENV"

      - name: Autenticar Docker no Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # Passo 0: resolve as URLs que já existem. Tolera "not found" porque no
      # bootstrap nenhum dos dois serviços existe ainda (ver DESIGN, Decisão 1).
      - name: Resolver URLs existentes
        id: urls
        run: |
          resolver_url() {
            gcloud run services describe "$1" \
              --region="$REGION" --format='value(status.url)' 2>/dev/null || true
          }
          echo "api=$(resolver_url "$SERVICE_API")" >> "$GITHUB_OUTPUT"
          echo "frontend=$(resolver_url "$SERVICE_FRONTEND")" >> "$GITHUB_OUTPUT"

      - name: Build e push da imagem da API
        if: ${{ inputs.target == 'api' || inputs.target == 'both' }}
        run: |
          docker build -f api/Dockerfile \
            -t "${IMAGE_REPO}/api:${GITHUB_SHA}" \
            -t "${IMAGE_REPO}/api:latest" .
          docker push "${IMAGE_REPO}/api:${GITHUB_SHA}"
          docker push "${IMAGE_REPO}/api:latest"

      # Deploy sempre pela tag de SHA, nunca :latest — a revisão do Cloud Run
      # fica rastreável até um commit exato (DESIGN, Decisão 7).
      - name: Deploy da API
        if: ${{ inputs.target == 'api' || inputs.target == 'both' }}
        env:
          API_KEYS: ${{ secrets.API_KEYS }}
          FRONTEND_URL_ATUAL: ${{ steps.urls.outputs.frontend }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          if [ -z "$API_KEYS" ]; then
            echo "Secret API_KEYS ausente. A API subiria devolvendo 401 para tudo."
            exit 1
          fi
          ORIGINS="${FRONTEND_URL_ATUAL:-http://localhost:3000}"
          # LLM_REAL_VERTEX_AI: GCP_PROJECT_ID/QDRANT_URL/QDRANT_API_KEY
          # passam a ser lidos em runtime por orquestracao/config.py — antes
          # desta feature a API nunca falava com Vertex AI nem Qdrant
          # (pesquisador_legal era fake), então nenhum dos três existia aqui.
          #
          # ^@^ troca o separador de "," para "@": o JSON de API_KEYS contém
          # vírgulas e seria truncado com o separador padrão do gcloud. Todas
          # as variáveis entram no mesmo delimitador — misturar duas flags
          # --set-env-vars não funciona, a última vence sozinha.
          gcloud run deploy "$SERVICE_API" \
            --image="${IMAGE_REPO}/api:${GITHUB_SHA}" \
            --region="$REGION" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --quiet \
            --service-account="$RUNTIME_SA" \
            --add-cloudsql-instances="$CLOUDSQL_CONNECTION_NAME" \
            --set-env-vars="^@^API_KEYS=${API_KEYS}@FRONTEND_ORIGINS=${ORIGINS}@DB_INSTANCE_CONNECTION_NAME=${CLOUDSQL_CONNECTION_NAME}@DB_NAME=taxreformai@DB_USER=taxreformai_app@GCP_PROJECT_ID=${GCP_PROJECT_ID}@QDRANT_URL=${QDRANT_URL}@QDRANT_API_KEY=${QDRANT_API_KEY}" \
            --set-secrets="DB_PASSWORD=taxreformai-pg-app-password:latest"

      - name: Resolver URL da API
        id: api_url
        run: |
          URL=$(gcloud run services describe "$SERVICE_API" \
            --region="$REGION" --format='value(status.url)' 2>/dev/null || true)
          if [ -z "$URL" ]; then
            echo "Serviço $SERVICE_API não existe. Rode primeiro com target=api ou both —"
            echo "buildar o frontend agora embutiria http://localhost:8000 no bundle."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # NEXT_PUBLIC_API_BASE_URL é inlinada no bundle JS em build time
      # (frontend/lib/api-client.ts), por isso entra como --build-arg e não
      # como env var de runtime.
      - name: Build e push da imagem do frontend
        if: ${{ inputs.target == 'frontend' || inputs.target == 'both' }}
        env:
          API_URL: ${{ steps.api_url.outputs.url }}
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg "NEXT_PUBLIC_API_BASE_URL=${API_URL}" \
            -t "${IMAGE_REPO}/frontend:${GITHUB_SHA}" \
            -t "${IMAGE_REPO}/frontend:latest" frontend/
          docker push "${IMAGE_REPO}/frontend:${GITHUB_SHA}"
          docker push "${IMAGE_REPO}/frontend:latest"

      - name: Deploy do frontend
        if: ${{ inputs.target == 'frontend' || inputs.target == 'both' }}
        run: |
          gcloud run deploy "$SERVICE_FRONTEND" \
            --image="${IMAGE_REPO}/frontend:${GITHUB_SHA}" \
            --region="$REGION" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --quiet \
            --service-account="$RUNTIME_SA"

      - name: Resolver URL do frontend
        id: frontend_url
        run: |
          URL=$(gcloud run services describe "$SERVICE_FRONTEND" \
            --region="$REGION" --format='value(status.url)' 2>/dev/null || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # Passo 3: no bootstrap a API foi deployada antes de o frontend existir,
      # então FRONTEND_ORIGINS ficou no default localhost. Compara antes de
      # atualizar para não gerar uma revisão nova a cada deploy.
      - name: Reconciliar CORS da API
        env:
          FRONTEND_URL: ${{ steps.frontend_url.outputs.url }}
        run: |
          if [ -z "$FRONTEND_URL" ]; then
            echo "Frontend ainda não existe — nada a reconciliar."
            exit 0
          fi
          ATUAL=$(gcloud run services describe "$SERVICE_API" --region="$REGION" --format=json \
            | jq -r '.spec.template.spec.containers[0].env[]? | select(.name=="FRONTEND_ORIGINS") | .value')
          if [ "$ATUAL" != "$FRONTEND_URL" ]; then
            echo "CORS desatualizado ('$ATUAL' != '$FRONTEND_URL') — reconciliando."
            gcloud run services update "$SERVICE_API" --region="$REGION" --quiet \
              --update-env-vars="FRONTEND_ORIGINS=${FRONTEND_URL}"
          else
            echo "CORS já correto — nenhuma revisão nova."
          fi

      # /health sozinho passaria nos dois modos de falha que mais preocupam
      # (API_KEYS ausente, FRONTEND_ORIGINS errada), por isso as 4 asserções.
      # O path é /health e não /healthz porque o Google Front End intercepta
      # `/healthz` em *.run.app e devolve o próprio 404 — ver api/main.py.
      - name: Smoke test
        env:
          API_KEYS: ${{ secrets.API_KEYS }}
          API_URL: ${{ steps.api_url.outputs.url }}
          FRONTEND_URL: ${{ steps.frontend_url.outputs.url }}
        run: |
          set -euo pipefail

          curl -fsS --max-time 20 "${API_URL}/health" > /dev/null
          echo "OK health"

          CHAVE=$(echo "$API_KEYS" | jq -r 'keys[0]')
          TENANT=$(echo "$API_KEYS" | jq -r --arg k "$CHAVE" '.[$k]')
          HTTP=$(curl -sS -o /tmp/sim.json -w '%{http_code}' --max-time 30 \
            -X POST "${API_URL}/v1/tax/simulate" \
            -H "X-API-Key: ${CHAVE}" -H 'Content-Type: application/json' \
            -d "{\"tenant_id\":\"${TENANT}\",\"ano_operacao\":2026,\"operacao_tipo\":\"VENDA\",
                 \"itens\":[{\"sku\":\"SMOKE-1\",\"ncm\":\"22030000\",\"quantidade\":1,
                             \"valor_unitario\":\"100.00\",\"uf_origem\":\"SP\",\"uf_destino\":\"RJ\"}]}")
          if [ "$HTTP" != "200" ]; then
            echo "FALHA: /v1/tax/simulate devolveu $HTTP (esperado 200)."
            echo "401 => secret API_KEYS não chegou; 403 => tenant_id divergente."
            cat /tmp/sim.json
            exit 1
          fi
          echo "OK simulate"

          # E2E completo do IPI contra a API pública: normalização do NCM
          # (o payload acima manda "22030000", a tabela guarda "2203.00.00"),
          # GRANT do papel de runtime, pool e agregação. Sem esta asserção o
          # único sintoma de qualquer um desses quebrar seria total_ipi = null
          # na resposta — 200, verde, e silenciosamente sem IPI.
          TOTAL_IPI=$(jq -r '.regime_vigente.total_ipi' /tmp/sim.json)
          if [ "$TOTAL_IPI" = "null" ]; then
            echo "FALHA: regime_vigente.total_ipi veio null."
            echo "Situação por item (CONSULTA_INDISPONIVEL => banco/GRANT; NCM_NAO_ENCONTRADO => TIPI não ingerida ou normalização quebrada):"
            jq -r '.regime_vigente.ipi_nao_resolvido' /tmp/sim.json
            exit 1
          fi
          echo "OK ipi (total_ipi=${TOTAL_IPI})"

          # E2E da Cesta Básica (LCP 214/2025, art. 125, Anexo I) contra a API
          # pública: migração 005 aplicada, GRANT do papel de runtime, geração
          # de prefixos e o override por item. Pela Decisão 8, uma falha em
          # qualquer um deles NÃO produz erro — produz a alíquota geral, que é
          # exatamente a resposta de antes da feature: 200, verde, e sem
          # redução nenhuma.
          #
          # Chamada SEPARADA da anterior, de propósito: acrescentar a manteiga
          # ao payload do smoke test do IPI faria `total_ipi` depender de
          # 0405.10.00 estar na TIPI ingerida, e UM item de mercadoria não
          # resolvido zera `total_ipi` para null — a asserção de IPI acima
          # reprovaria o job por um motivo que nada tem a ver com a mudança.
          # Dois payloads, duas asserções, zero acoplamento.
          HTTP=$(curl -sS -o /tmp/sim_cesta.json -w '%{http_code}' --max-time 30 \
            -X POST "${API_URL}/v1/tax/simulate" \
            -H "X-API-Key: ${CHAVE}" -H 'Content-Type: application/json' \
            -d "{\"tenant_id\":\"${TENANT}\",\"ano_operacao\":2026,\"operacao_tipo\":\"VENDA\",
                 \"itens\":[{\"sku\":\"SMOKE-CESTA\",\"ncm\":\"04051000\",\"quantidade\":1,
                             \"valor_unitario\":\"1000.00\",\"uf_origem\":\"SP\",\"uf_destino\":\"RJ\"}]}")
          if [ "$HTTP" != "200" ]; then
            echo "FALHA: /v1/tax/simulate (cesta básica) devolveu $HTTP (esperado 200)."
            cat /tmp/sim_cesta.json
            exit 1
          fi

          SITUACAO=$(jq -r '.itens_detalhados[0].reducao.situacao' /tmp/sim_cesta.json)
          DISPENSADO=$(jq -r '.reducao.total_cbs_dispensado' /tmp/sim_cesta.json)
          CBS_PCT=$(jq -r '.itens_detalhados[0].aliquotas_aplicadas.cbs_percentual | tonumber' /tmp/sim_cesta.json)
          if [ "$DISPENSADO" = "null" ] || [ "$CBS_PCT" != "0" ]; then
            echo "FALHA: manteiga (0405.10.00, item 5 do Anexo I) não recebeu alíquota zero."
            echo "situacao=${SITUACAO} total_cbs_dispensado=${DISPENSADO} cbs_percentual=${CBS_PCT}"
            echo "CONSULTA_INDISPONIVEL => migração 005/007 não aplicada ou GRANT ausente;"
            echo "FORA_DO_ANEXO => seed truncado ou geração de prefixos quebrada."
            exit 1
          fi
          echo "OK cesta básica (situacao=${SITUACAO}, cbs dispensado=${DISPENSADO})"

          # E2E do prefixo de CAPÍTULO (2 dígitos) — Anexo XV, item 4, art. 148.
          # É o único mecanismo desta feature que pode falhar sozinho e em
          # silêncio: se `api/ncm.py::_COMPRIMENTOS_PREFIXO` e a CHECK
          # `prefixo_comprimento_valido` (migração 007) saírem de sincronia, o
          # prefixo '06' nunca é gerado (ou nunca é inserível) e TODO o resto
          # continua verde — a manteiga acima inclusive.
          #
          # Terceira chamada, com payload próprio, pelo mesmo motivo da segunda:
          # 06031100 NÃO precisa estar na TIPI ingerida, e é justamente por isso
          # que serve — a redução a zero por capítulo não depende do cadastro da
          # TIPI, e esta asserção não menciona IPI.
          HTTP=$(curl -sS -o /tmp/sim_capitulo.json -w '%{http_code}' --max-time 30 \
            -X POST "${API_URL}/v1/tax/simulate" \
            -H "X-API-Key: ${CHAVE}" -H 'Content-Type: application/json' \
            -d "{\"tenant_id\":\"${TENANT}\",\"ano_operacao\":2026,\"operacao_tipo\":\"VENDA\",
                 \"itens\":[{\"sku\":\"SMOKE-CAPITULO-6\",\"ncm\":\"06031100\",\"quantidade\":1,
                             \"valor_unitario\":\"1000.00\",\"uf_origem\":\"SP\",\"uf_destino\":\"RJ\"}]}")
          if [ "$HTTP" != "200" ]; then
            echo "FALHA: /v1/tax/simulate (Capítulo 6) devolveu $HTTP (esperado 200)."
            cat /tmp/sim_capitulo.json
            exit 1
          fi

          SITUACAO=$(jq -r '.itens_detalhados[0].reducao.situacao' /tmp/sim_capitulo.json)
          ANEXO=$(jq -r '.itens_detalhados[0].reducao.anexo' /tmp/sim_capitulo.json)
          ITEM=$(jq -r '.itens_detalhados[0].reducao.item' /tmp/sim_capitulo.json)
          DISPENSADO=$(jq -r '.reducao.total_cbs_dispensado' /tmp/sim_capitulo.json)
          CBS_PCT=$(jq -r '.itens_detalhados[0].aliquotas_aplicadas.cbs_percentual | tonumber' /tmp/sim_capitulo.json)
          if [ "$DISPENSADO" = "null" ] || [ "$CBS_PCT" != "0" ]; then
            echo "FALHA: flores (06031100, Capítulo 6 = item 4 do Anexo XV) não receberam alíquota zero."
            echo "situacao=${SITUACAO} anexo=${ANEXO} item=${ITEM} total_cbs_dispensado=${DISPENSADO} cbs_percentual=${CBS_PCT}"
            echo "CONSULTA_INDISPONIVEL => migrações 007/008 não aplicadas ou GRANT ausente;"
            echo "FORA_DO_ANEXO => o prefixo de 2 dígitos não está sendo gerado ou não foi inserido."
            exit 1
          fi
          echo "OK capítulo 6 (Anexo ${ANEXO}, item ${ITEM}, cbs dispensado=${DISPENSADO})"

          # E2E da redução PERCENTUAL (60%) — Anexo VIII, item 1, art. 136
          # (sabão de toucador). É o mecanismo mais novo desta feature
          # (`aplicar_reducao_percentual`, nunca exercitado em produção antes
          # dela): 0,9% de CBS na fase de teste de 2026, reduzido em 60%,
          # sobra 0,36% — se a fração ficar sobre o valor já arredondado em vez
          # da alíquota, o número diverge por 1 centavo sem sintoma nenhum.
          #
          # Quarta chamada, payload próprio, mesmo motivo das anteriores: não
          # acoplar esta asserção a nenhum outro tributo/Anexo já verificado.
          HTTP=$(curl -sS -o /tmp/sim_percentual.json -w '%{http_code}' --max-time 30 \
            -X POST "${API_URL}/v1/tax/simulate" \
            -H "X-API-Key: ${CHAVE}" -H 'Content-Type: application/json' \
            -d "{\"tenant_id\":\"${TENANT}\",\"ano_operacao\":2026,\"operacao_tipo\":\"VENDA\",
                 \"itens\":[{\"sku\":\"SMOKE-PERCENTUAL\",\"ncm\":\"34011190\",\"quantidade\":1,
                             \"valor_unitario\":\"1000.00\",\"uf_origem\":\"SP\",\"uf_destino\":\"RJ\"}]}")
          if [ "$HTTP" != "200" ]; then
            echo "FALHA: /v1/tax/simulate (redução percentual) devolveu $HTTP (esperado 200)."
            cat /tmp/sim_percentual.json
            exit 1
          fi

          CBS_PCT=$(jq -r '.itens_detalhados[0].aliquotas_aplicadas.cbs_percentual | tonumber' /tmp/sim_percentual.json)
          PERCENTUAL=$(jq -r '.itens_detalhados[0].reducao.percentual_reducao' /tmp/sim_percentual.json)
          if [ "$CBS_PCT" != "0.36" ]; then
            echo "FALHA: sabão de toucador (34011190, item 1 do Anexo VIII) não recebeu 60% de redução."
            echo "cbs_percentual=${CBS_PCT} percentual_reducao=${PERCENTUAL} (esperado cbs_percentual=0.36)"
            echo "CONSULTA_INDISPONIVEL => migrações 009/010 não aplicadas ou GRANT ausente no catálogo;"
            echo "cbs_percentual=0.9 => aplicar_reducao_percentual não está reduzindo a alíquota."
            exit 1
          fi
          echo "OK redução percentual (Anexo VIII, item 1, cbs_percentual=${CBS_PCT}, percentual_reducao=${PERCENTUAL})"

          # E2E do PRIMEIRO vocabulário por NBS (não NCM/SH) — Anexo II, item 4
          # (Ensino Técnico), art. 129. Deliberadamente SEM condição (Anexo II
          # não tem nenhuma), separada dos 4 tributos/Anexos já verificados
          # acima: um GRANT faltando nas tabelas NOVAS (anexos_reducao_nbs/
          # anexos_reducao_nbs_prefixo) degrada para CONSULTA_INDISPONIVEL
          # silencioso e não afetaria nenhuma das chamadas anteriores.
          HTTP=$(curl -sS -o /tmp/sim_nbs.json -w '%{http_code}' --max-time 30 \
            -X POST "${API_URL}/v1/tax/simulate" \
            -H "X-API-Key: ${CHAVE}" -H 'Content-Type: application/json' \
            -d "{\"tenant_id\":\"${TENANT}\",\"ano_operacao\":2026,\"operacao_tipo\":\"VENDA\",
                 \"itens\":[{\"sku\":\"SMOKE-NBS\",\"ncm\":\"00000000\",\"natureza\":\"SERVICO\",
                             \"nbs\":\"1.2202.00.00\",\"quantidade\":1,\"valor_unitario\":\"1000.00\",
                             \"uf_origem\":\"SP\",\"uf_destino\":\"SP\"}]}")
          if [ "$HTTP" != "200" ]; then
            echo "FALHA: /v1/tax/simulate (redução por NBS) devolveu $HTTP (esperado 200)."
            cat /tmp/sim_nbs.json
            exit 1
          fi

          CBS_PCT_NBS=$(jq -r '.itens_detalhados[0].aliquotas_aplicadas.cbs_percentual | tonumber' /tmp/sim_nbs.json)
          ANEXO_NBS=$(jq -r '.itens_detalhados[0].reducao.anexo' /tmp/sim_nbs.json)
          if [ "$CBS_PCT_NBS" != "0.36" ] || [ "$ANEXO_NBS" != "II" ]; then
            echo "FALHA: Ensino Técnico (1.2202.00.00, item 4 do Anexo II) não recebeu 60% de redução."
            echo "anexo=${ANEXO_NBS} cbs_percentual=${CBS_PCT_NBS} (esperado anexo=II cbs_percentual=0.36)"
            echo "CONSULTA_INDISPONIVEL => migração 011 não aplicada ou GRANT ausente nas tabelas NBS."
            exit 1
          fi
          echo "OK redução por NBS (Anexo II, item 4, cbs_percentual=${CBS_PCT_NBS})"

          # E2E do piso do art. 371/Anexo XVI — endpoint DEDICADO, não
          # /v1/tax/simulate (que já 422 para todo ano_operacao >= 2027,
          # achado do build desta feature). Prova, numa chamada só, que o
          # endpoint funciona independente do motor de cálculo do IVA Dual
          # (2033 é justamente um ano em que /v1/tax/simulate falharia).
          HTTP=$(curl -sS -o /tmp/piso.json -w '%{http_code}' --max-time 20 \
            -X GET "${API_URL}/v1/tax/piso-aliquota-ibs/2033" \
            -H "X-API-Key: ${CHAVE}")
          if [ "$HTTP" != "200" ]; then
            echo "FALHA: /v1/tax/piso-aliquota-ibs/2033 devolveu $HTTP (esperado 200)."
            cat /tmp/piso.json
            exit 1
          fi
          PISO_PCT=$(jq -r '.limite_inferior_percentual | tonumber' /tmp/piso.json)
          PISO_APLICAVEL=$(jq -r '.aplicavel' /tmp/piso.json)
          if [ "$PISO_APLICAVEL" != "true" ] || [ "$PISO_PCT" != "90.5" ]; then
            echo "FALHA: piso do Anexo XVI para 2033 não é 90.5% (o único ano de salto)."
            echo "aplicavel=${PISO_APLICAVEL} limite_inferior_percentual=${PISO_PCT}"
            cat /tmp/piso.json
            exit 1
          fi
          echo "OK piso do Anexo XVI (2033, limite_inferior_percentual=${PISO_PCT})"

          # E2E da base de incidência do Imposto Seletivo (Anexo XVII) — um
          # veículo (inciso I), que sempre declara a exceção de uso nunca
          # verificada. Domínio de falha SEPARADO de tudo acima: uma tabela
          # sem GRANT aqui nunca afetaria CBS/IBS/IPI.
          HTTP=$(curl -sS -o /tmp/sim_is.json -w '%{http_code}' --max-time 30 \
            -X POST "${API_URL}/v1/tax/simulate" \
            -H "X-API-Key: ${CHAVE}" -H 'Content-Type: application/json' \
            -d "{\"tenant_id\":\"${TENANT}\",\"ano_operacao\":2026,\"operacao_tipo\":\"VENDA\",
                 \"itens\":[{\"sku\":\"SMOKE-IS\",\"ncm\":\"8704.21.10\",\"quantidade\":1,
                             \"valor_unitario\":\"1000.00\",\"uf_origem\":\"SP\",\"uf_destino\":\"SP\"}]}")
          if [ "$HTTP" != "200" ]; then
            echo "FALHA: /v1/tax/simulate (imposto seletivo) devolveu $HTTP (esperado 200)."
            cat /tmp/sim_is.json
            exit 1
          fi
          IS_SITUACAO=$(jq -r '.itens_detalhados[0].imposto_seletivo.situacao' /tmp/sim_is.json)
          IS_CATEGORIA=$(jq -r '.itens_detalhados[0].imposto_seletivo.categoria' /tmp/sim_is.json)
          if [ "$IS_SITUACAO" != "SUJEITO" ] || [ "$IS_CATEGORIA" != "Veículos" ]; then
            echo "FALHA: 8704.21.10 não foi classificado como sujeito ao IS (categoria Veículos)."
            echo "situacao=${IS_SITUACAO} categoria=${IS_CATEGORIA}"
            echo "CONSULTA_INDISPONIVEL => migração 013 não aplicada ou GRANT ausente."
            exit 1
          fi
          echo "OK base de incidência do IS (Anexo XVII, categoria=${IS_CATEGORIA})"

          # E2E do Simples Nacional (Anexos XVIII-XXIII) — endpoint DEDICADO,
          # independente de /v1/tax/simulate/engine.py. Comércio, 1a Faixa,
          # 2027: prova a fórmula do art. 18 da LC 123/2006 (alíquota
          # efetiva) e a partilha por tributo ponta a ponta.
          HTTP=$(curl -sS -o /tmp/sn.json -w '%{http_code}' --max-time 30 \
            -X POST "${API_URL}/v1/tax/simulate-simples-nacional" \
            -H "X-API-Key: ${CHAVE}" -H 'Content-Type: application/json' \
            -d "{\"tenant_id\":\"${TENANT}\",\"ano_operacao\":2027,
                 \"atividade\":\"COMERCIO\",
                 \"receita_bruta_acumulada_12_meses\":\"150000.00\",
                 \"receita_bruta_mes\":\"12500.00\"}")
          if [ "$HTTP" != "200" ]; then
            echo "FALHA: /v1/tax/simulate-simples-nacional devolveu $HTTP (esperado 200)."
            cat /tmp/sn.json
            exit 1
          fi
          SN_FAIXA=$(jq -r '.faixa' /tmp/sn.json)
          if [ "$SN_FAIXA" != "1" ]; then
            echo "FALHA: Comércio com RBT12=150000 não caiu na 1a Faixa."
            cat /tmp/sn.json
            exit 1
          fi
          echo "OK Simples Nacional (Anexo XVIII, faixa=${SN_FAIXA})"

          # E2E do catálogo de SKUs (API_EMPRESA_SKUS) — round-trip completo
          # (criar, consultar, excluir) para o smoke test ser IDEMPOTENTE
          # entre deploys: sem o DELETE final, o segundo deploy bateria num
          # 409 de codigo_sku duplicado neste mesmo tenant.
          HTTP=$(curl -sS -o /tmp/sku.json -w '%{http_code}' --max-time 20 \
            -X POST "${API_URL}/v1/tax/skus" \
            -H "X-API-Key: ${CHAVE}" -H 'Content-Type: application/json' \
            -d "{\"tenant_id\":\"${TENANT}\",\"codigo_sku\":\"SMOKE-SKU-1\",
                 \"descricao\":\"SKU de smoke test\",\"natureza\":\"MERCADORIA\",
                 \"ncm_code\":\"22030000\"}")
          if [ "$HTTP" != "201" ]; then
            echo "FALHA: POST /v1/tax/skus devolveu $HTTP (esperado 201)."
            cat /tmp/sku.json
            exit 1
          fi
          HTTP=$(curl -sS -o /tmp/sku_get.json -w '%{http_code}' --max-time 20 \
            -X GET "${API_URL}/v1/tax/skus/SMOKE-SKU-1" -H "X-API-Key: ${CHAVE}")
          NCM_SKU=$(jq -r '.ncm_code' /tmp/sku_get.json)
          if [ "$HTTP" != "200" ] || [ "$NCM_SKU" != "22030000" ]; then
            echo "FALHA: GET /v1/tax/skus/SMOKE-SKU-1 devolveu $HTTP, ncm_code=$NCM_SKU (esperado 200/22030000)."
            cat /tmp/sku_get.json
            exit 1
          fi
          curl -sS -o /dev/null --max-time 20 -X DELETE "${API_URL}/v1/tax/skus/SMOKE-SKU-1" -H "X-API-Key: ${CHAVE}"
          echo "OK catálogo de SKUs (criar, consultar, excluir)"

          # E2E de LLM_REAL_VERTEX_AI: 1 chamada real a /v1/tax/query exercita,
          # numa tacada só, os 3 nós que passaram a chamar o Vertex AI de
          # verdade (classificador/Haiku, extrator_regras/Sonnet,
          # sintetizador/Sonnet) e a busca híbrida real do pesquisador_legal
          # no Qdrant — minimiza o número de chamadas reais cobráveis por
          # verificação (DEFINE, Constraints). Gera custo real de token.
          HTTP=$(curl -sS -o /tmp/query.json -w '%{http_code}' --max-time 60 \
            -X POST "${API_URL}/v1/tax/query" \
            -H "X-API-Key: ${CHAVE}" -H 'Content-Type: application/json' \
            -d "{\"tenant_id\":\"${TENANT}\",\"texto_consulta\":\"Quanto de CBS incide sobre uma venda de R\$ 1000,00 em 2026?\",
                 \"ano_operacao\":2026,\"valor_base\":\"1000.00\"}")
          if [ "$HTTP" != "200" ]; then
            echo "FALHA: /v1/tax/query devolveu $HTTP (esperado 200)."
            cat /tmp/query.json
            exit 1
          fi
          if grep -q '\[FAKE\]' /tmp/query.json; then
            echo "FALHA: resposta de /v1/tax/query ainda contém marcador [FAKE] — nó(s) não real(is)."
            cat /tmp/query.json
            exit 1
          fi
          CHUNKS_RECUPERADOS=$(jq -r '.historico[] | select(.no=="pesquisador_legal") | .resumo_output' /tmp/query.json)
          if ! echo "$CHUNKS_RECUPERADOS" | grep -qE '^[1-9][0-9]* chunk'; then
            echo "FALHA: pesquisador_legal não recuperou nenhum chunk real do Qdrant."
            echo "resumo_output=${CHUNKS_RECUPERADOS}"
            exit 1
          fi
          echo "OK query LLM real (${CHUNKS_RECUPERADOS})"

          if [ -n "$FRONTEND_URL" ]; then
            # `|| true` é essencial: quando a origem é recusada não existe header
            # algum, o grep sai 1 e, com `set -euo pipefail`, mataria o script
            # aqui — reprovando o job sem imprimir o diagnóstico abaixo.
            ACAO=$(curl -sS -D - -o /dev/null --max-time 20 \
              -X OPTIONS "${API_URL}/v1/tax/simulate" \
              -H "Origin: ${FRONTEND_URL}" \
              -H 'Access-Control-Request-Method: POST' \
              | grep -i '^access-control-allow-origin:' | tr -d '\r' | awk '{print $2}' || true)
            if [ "$ACAO" != "$FRONTEND_URL" ]; then
              echo "FALHA CORS: recebido '$ACAO', esperado '$FRONTEND_URL'."
              echo "O frontend deployado não conseguiria chamar a API."
              exit 1
            fi
            echo "OK cors"

            curl -fsS --max-time 30 "${FRONTEND_URL}/" > /dev/null
            echo "OK frontend"
          fi

      # Prova que a API deployada de fato gravou o audit log — não que o
      # código está certo em revisão, mas que o serviço real, com sua própria
      # identidade de runtime, sua própria rede e seu próprio Secret Manager,
      # conseguiu chegar no Cloud SQL. É o mesmo padrão de "verificação de
      # verdade" que este projeto já usa no smoke test da API em si.
      - name: Verificar que o audit log foi gravado de verdade
        env:
          API_KEYS: ${{ secrets.API_KEYS }}
        run: |
          set -euo pipefail
          curl -sSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.23.0/cloud-sql-proxy.linux.amd64
          echo "cd689d582b826fa5bc82c01ccc14e45a58200c3cefbf923ce96c422825e4e6f6  cloud-sql-proxy" | sha256sum -c -
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5433 "$CLOUDSQL_CONNECTION_NAME" &
          PROXY_PID=$!
          trap 'kill $PROXY_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/5433) 2>/dev/null && break
            sleep 1
          done

          # Senha do papel APP, não do admin: esta verificação só faz SELECT
          # dentro da sessão do próprio tenant — não precisa de privilégio
          # nenhum que o admin tenha e o app não. A SA de deploy nunca ganha
          # acesso à credencial que pode alterar schema.
          PG_APP_PASSWORD=$(gcloud secrets versions access latest --secret=taxreformai-pg-app-password --project=taxreformai-dev)
          export DATABASE_URL="postgresql://taxreformai_app:${PG_APP_PASSWORD}@127.0.0.1:5433/taxreformai"
          TENANT=$(echo "$API_KEYS" | jq -r '.[keys[0]]')
          python scripts/verificar_audit_log_gravado.py "$TENANT" "SMOKE-1"

      - name: Resumo
        if: always()
        env:
          API_URL: ${{ steps.api_url.outputs.url }}
          FRONTEND_URL: ${{ steps.frontend_url.outputs.url }}
        run: |
          {
            echo "### Deploy Cloud Run"
            echo ""
            echo "| Item | Valor |"
            echo "|------|-------|"
            echo "| Target | \`${{ inputs.target }}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| API | ${API_URL:-—} |"
            echo "| Frontend | ${FRONTEND_URL:-—} |"
          } >> "$GITHUB_STEP_SUMMARY"
