name: Diagnostico Cloud Run Logs

# Só leitura — busca logs reais do Cloud Run para diagnosticar uma falha já
# observada (ex: 503 sem corpo no smoke test de deploy.yml). Não builda, não
# deploya, não gera custo de LLM/Vertex AI. Descartável após o uso.
on:
  workflow_dispatch:
    inputs:
      service:
        description: "Nome do serviço Cloud Run (ignorado se 'filtro' for preenchido)"
        required: true
        default: "taxreformai-api"
      minutos:
        description: "Janela de tempo (minutos atrás) para buscar logs"
        required: true
        default: "20"
      filtro:
        description: "Filtro completo do Cloud Logging (sobrescreve 'service' se preenchido) — ex: para tasks do Composer"
        required: false
        default: ""

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_DEPLOYER_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Buscar logs de erro/aviso do serviço
        run: |
          FRESHNESS="${{ inputs.minutos }}m"
          FILTRO="${{ inputs.filtro }}"
          if [ -z "$FILTRO" ]; then
            FILTRO="resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${{ inputs.service }}\" AND severity>=DEFAULT"
          fi
          gcloud logging read \
            "$FILTRO" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --freshness="$FRESHNESS" \
            --limit=200 \
            --format="table(timestamp, severity, textPayload, jsonPayload.message)"
