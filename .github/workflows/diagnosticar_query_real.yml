name: Diagnosticar Query Real (sintetizador)

# Dispara UMA chamada real a /v1/tax/query sem refazer o deploy inteiro —
# só para capturar, via Cloud Logging, o texto real gerado pelo Sonnet
# quando o guardrail do sintetizador rejeita. Descartável após o uso.
on:
  workflow_dispatch: {}

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /v1/tax/query real
        env:
          API_URL: https://taxreformai-api-as2g43xasa-rj.a.run.app
          API_KEYS: ${{ secrets.API_KEYS }}
        run: |
          CHAVE=$(echo "$API_KEYS" | jq -r 'keys[0]')
          HTTP=$(curl -sS -o /tmp/query.json -w '%{http_code}' --max-time 120 \
            -X POST "${API_URL}/v1/tax/query" \
            -H "X-API-Key: ${CHAVE}" -H 'Content-Type: application/json' \
            -d "{\"texto_consulta\":\"Quanto de CBS incide sobre uma venda de R\$ 1000,00 em 2026?\",
                 \"ano_operacao\":2026,
                 \"itens\":[{\"sku\":\"DIAG-QUERY\",\"ncm\":\"22030000\",\"quantidade\":1,
                             \"valor_unitario\":\"1000.00\",\"uf_origem\":\"SP\",\"uf_destino\":\"RJ\"}]}")
          echo "HTTP=$HTTP"
          cat /tmp/query.json
