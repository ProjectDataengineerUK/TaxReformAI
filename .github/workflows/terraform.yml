name: Terraform GCP Infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan (preview only) ou apply (cria recursos reais e cobráveis)"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
      confirm_apply:
        description: 'Para action=apply, digite exatamente "APPLY" para confirmar'
        required: false
        default: ""

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Authenticate to GCP
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> "$GITHUB_ENV"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="bucket_name=${{ secrets.GCP_PROJECT_ID }}-legal-docs" \
            -out=tfplan

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' && inputs.confirm_apply == 'APPLY' }}
        run: terraform apply -auto-approve tfplan

      - name: Apply blocked (confirmation missing)
        if: ${{ inputs.action == 'apply' && inputs.confirm_apply != 'APPLY' }}
        run: |
          echo "action=apply exigido, mas confirm_apply != 'APPLY'. Nenhum recurso foi criado."
          exit 1

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/gcp-key.json
