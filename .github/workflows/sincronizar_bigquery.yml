name: Sincronizar BigQuery

# Trigger duplo (Decisão 4 do DESIGN_BIGQUERY_DATA_WAREHOUSE.md): a primeira
# execução real é sempre manual (workflow_dispatch), para provar o sync antes
# de confiar no cron sozinho. A partir daí o schedule assume, sem exigir
# clique humano — primeiro gatilho automático de infraestrutura real do
# projeto, decisão explícita do usuário. Mitigado pelo escopo mínimo da SA
# dedicada (taxreformai-bigquery-sync): mesmo que dispare por engano, só
# consegue LER o Postgres e ESCREVER no dataset de analytics.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC = 03:00 BRT, fora do horário comercial
  workflow_dispatch: {}

env:
  PYTHONPATH: ${{ github.workspace }}
  INSTANCE_CONNECTION_NAME: taxreformai-dev:southamerica-east1:taxreformai-pg
  GCP_PROJECT_ID: taxreformai-dev

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_BIGQUERY_SYNC_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Ler senha do admin no Secret Manager
        run: |
          echo "PG_ADMIN_PASSWORD=$(gcloud secrets versions access latest --secret=taxreformai-pg-admin-password --project=$GCP_PROJECT_ID)" >> "$GITHUB_ENV"

      - name: Baixar Cloud SQL Auth Proxy
        run: |
          curl -sSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.23.0/cloud-sql-proxy.linux.amd64
          echo "cd689d582b826fa5bc82c01ccc14e45a58200c3cefbf923ce96c422825e4e6f6  cloud-sql-proxy" | sha256sum -c -
          chmod +x cloud-sql-proxy

      - name: Iniciar o proxy em background
        run: |
          ./cloud-sql-proxy --port 5432 "$INSTANCE_CONNECTION_NAME" &
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null && break
            sleep 1
          done

      - name: Sincronizar Cloud SQL -> BigQuery
        env:
          DATABASE_URL: postgresql://taxreformai_admin:${{ env.PG_ADMIN_PASSWORD }}@127.0.0.1:5432/taxreformai
        run: python scripts/sincronizar_bigquery.py
