name: Ingestão Legal (E2E real)

# Fecha o critério de sucesso pendente de PIPELINE_INGESTAO_LEGAL desde
# 2026-07-24: "busca híbrida retorna o dispositivo correto (top-3)".
# O SHIPPED admite explicitamente "Cloud Composer real OU workflow de CI
# equivalente" — este é o workflow equivalente, sem esperar o Composer.
#
# workflow_dispatch apenas: escreve em GCS e Qdrant reais (cobráveis).
on:
  workflow_dispatch:
    inputs:
      fonte:
        description: "Qual fonte ingerir antes de verificar"
        required: true
        default: "planalto"
        type: choice
        options:
          - planalto
          - nenhuma
      confirm:
        description: 'Digite exatamente "INGERIR" para confirmar'
        required: true
        default: ""

jobs:
  ingestao-e-verificacao:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Guarda de confirmação
        if: ${{ inputs.confirm != 'INGERIR' }}
        run: |
          echo "confirm != 'INGERIR'. Nada foi escrito em GCS ou Qdrant."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # fastembed baixa o BGE-M3 (~2GB) na primeira execução; o cache evita
      # repetir isso a cada run.
      - name: Cache dos modelos fastembed
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ runner.os }}-bge-m3

      - name: Autenticar no GCP
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> "$GITHUB_ENV"

      - name: Executar pipeline de ingestão (Planalto — LCP 214/2025)
        if: ${{ inputs.fonte == 'planalto' }}
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          python -m ingestion.pipeline run \
            --url "https://www.planalto.gov.br/ccivil_03/leis/lcp/Lcp214.htm" \
            --documento-id "LCP_214_2025" \
            --titulo "Lei Complementar 214/2025" \
            --esfera "FEDERAL_CBS_IBS" \
            --data-vigencia-inicio "2027-01-01"

      - name: Verificar busca híbrida
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: python scripts/verificar_busca_hibrida.py

      - name: Limpar credenciais
        if: always()
        run: rm -f /tmp/gcp-key.json
