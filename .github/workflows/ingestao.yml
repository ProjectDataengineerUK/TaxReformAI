name: Ingestão Legal (E2E real)

# Fecha o critério de sucesso pendente de PIPELINE_INGESTAO_LEGAL desde
# 2026-07-24: "busca híbrida retorna o dispositivo correto (top-3)".
# O SHIPPED admite explicitamente "Cloud Composer real OU workflow de CI
# equivalente" — este é o workflow equivalente, sem esperar o Composer.
#
# workflow_dispatch apenas: escreve em GCS e Qdrant reais (cobráveis).
on:
  workflow_dispatch:
    inputs:
      fonte:
        description: "Qual fonte ingerir antes de verificar"
        required: true
        default: "planalto"
        type: choice
        options:
          - planalto
          - tcu
          - cgibs
          - cgibs_demais
          - rfb
          - rfb_ade
          - todas
          - nenhuma
      recriar_colecao:
        description: "Apagar a coleção do Qdrant antes de ingerir (reingestão limpa)"
        required: true
        default: "nao"
        type: choice
        options:
          - "nao"
          - "sim"
      confirm:
        description: 'Digite exatamente "INGERIR" para confirmar'
        required: true
        default: ""
      cgibs_pular:
        description: "Só para fonte=cgibs_demais: números a NÃO reingerir, separados por vírgula, substituindo o default (só a nº 6). Ex., depois de 9 já terem ingerido com sucesso: '1,2,3,4,5,6,7,8,9,13' para tentar só as que faltam"
        required: false
        default: ""
      verificar_lc227:
        description: "Diagnóstico único: o corpus já indexado (LCP_214_2025) reflete a LC 227/2026? Só leitura, não reingere nada"
        required: true
        default: "nao"
        type: choice
        options:
          - "nao"
          - "sim"

jobs:
  ingestao-e-verificacao:
    runs-on: ubuntu-latest
    # 45 min bastavam para uma fonte. Com quatro, os dois documentos grandes
    # (LCP 214 com 3417 chunks e Resolução CGIBS 6 com 3443) custam ~20 min de
    # embedding cada, e `fonte=todas` estouraria o limite no meio da execução.
    timeout-minutes: 90
    # `python scripts/x.py` põe scripts/ no sys.path, não a raiz do repo — os
    # scripts importam `ingestion.*` e quebrariam com ModuleNotFoundError. Vale
    # para o job inteiro porque os dois scripts (reset e verificação) precisam.
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Guarda de confirmação
        if: ${{ inputs.confirm != 'INGERIR' }}
        run: |
          echo "confirm != 'INGERIR'. Nada foi escrito em GCS ou Qdrant."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # fastembed baixa o modelo denso (~2GB) na primeira execução; o cache evita
      # repetir isso a cada run.
      - name: Cache dos modelos fastembed
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ runner.os }}-e5-large

      - name: Autenticar no GCP
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> "$GITHUB_ENV"

      # Os point ids derivam de documento_id:dispositivo. Se o texto-fonte muda
      # a ponto de alterar o rótulo do dispositivo, a reingestão grava pontos
      # novos e os antigos ficam órfãos — foi o caso da corrupção de acentuação.
      - name: Apagar coleção (reingestão limpa)
        if: ${{ inputs.recriar_colecao == 'sim' }}
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: python scripts/resetar_colecao.py

      - name: Executar pipeline de ingestão (Planalto — LCP 214/2025)
        if: ${{ inputs.fonte == 'planalto' || inputs.fonte == 'todas' }}
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          python -m ingestion.pipeline run \
            --fonte planalto \
            --url "https://www.planalto.gov.br/ccivil_03/leis/lcp/Lcp214.htm" \
            --documento-id "LCP_214_2025" \
            --titulo "Lei Complementar 214/2025" \
            --esfera "FEDERAL_CBS_IBS" \
            --data-vigencia-inicio "2027-01-01"

      # Segunda fonte real: PDF, não HTML. Os mesmos chunker/embedder/indexer
      # atendem as duas — é a prova de que o protocolo LegalSource era genérico
      # de verdade, e não só na intenção. Parâmetros espelham dags/ingestao_legal_dag.py.
      - name: Executar pipeline de ingestão (TCU — Resolução 388/2026)
        if: ${{ inputs.fonte == 'tcu' || inputs.fonte == 'todas' }}
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          python -m ingestion.pipeline run \
            --fonte tcu \
            --url "https://rotadajurisprudencia.com.br/wp-content/uploads/2026/06/Resolucao-TCU-388_2026.pdf" \
            --documento-id "TCU_RES_388_2026" \
            --titulo "Resolução TCU 388/2026" \
            --esfera "FEDERAL_CBS_IBS_METODOLOGIA" \
            --data-vigencia-inicio "2026-06-10"

      # Terceira fonte: Resolução CGIBS nº 6 regulamenta o IBS em 252 páginas e
      # 617 artigos, com "Seção VI - Das Alíquotas" e "Subseção III - Split
      # Payment". Cada artigo cita o dispositivo correspondente da LC 214/2025,
      # dando referência cruzada com a fonte do Planalto.
      - name: Executar pipeline de ingestão (CGIBS — Resolução 6/2026)
        if: ${{ inputs.fonte == 'cgibs' || inputs.fonte == 'todas' }}
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          python -m ingestion.pipeline run \
            --fonte cgibs \
            --url "https://www.cgibs.gov.br/upload/arquivos/202604/30084927-res-cgibs-n-6-30-abr-2026-regulamenta-o-ibs.pdf" \
            --documento-id "CGIBS_RES_6_2026" \
            --titulo "Resolução CGIBS 6/2026 — Regulamenta o IBS" \
            --esfera "SUBNACIONAL_IBS" \
            --data-vigencia-inicio "2026-04-30"

      # As outras 12 resoluções do CGIBS (regimentos, orçamento etc.) —
      # descobertas pela mesma listagem desde que a nº 6 foi ingerida, nunca
      # indexadas. Baixo valor para o motor de cálculo, mas completa a
      # cobertura do CGIBS que o blueprint pede. Fora de `fonte == 'todas'`
      # de propósito: são 12 documentos extras, e "todas" já ficou caro o
      # bastante com os 2 grandes (LCP 214 + Resolução 6).
      - name: Executar pipeline de ingestão (CGIBS — demais 12 resoluções)
        if: ${{ inputs.fonte == 'cgibs_demais' }}
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          CGIBS_PULAR: ${{ inputs.cgibs_pular }}
        run: python scripts/ingerir_demais_cgibs.py

      # Quarta fonte: Soluções de Consulta da RFB (SIJUT2), ementas apenas.
      # O texto integral mora numa SPA cuja API responde 403 e é construída em
      # torno de autenticação com certificado digital; a ementa é pública, é o
      # resumo vinculante do ato e traz número, órgão e data — citação
      # auditável por si só.
      # O termo é estreito de propósito: a busca casa palavras soltas
      # ("reforma tributária" devolve 463 atos) e resultados acima do tamanho
      # de página vêm truncados. O parser falha alto nesse caso em vez de
      # ingerir um recorte parcial.
      - name: Executar pipeline de ingestão (RFB — Soluções de Consulta)
        if: ${{ inputs.fonte == 'rfb' || inputs.fonte == 'todas' }}
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          python -m ingestion.pipeline run \
            --fonte rfb \
            --termo-busca "Lei Complementar 214, de 2025" \
            --url "http://normas.receita.fazenda.gov.br/sijut2consulta/consulta.action" \
            --documento-id "RFB_SC_LCP214" \
            --titulo "Soluções de Consulta RFB — Lei Complementar 214/2025" \
            --esfera "FEDERAL_CBS" \
            --data-vigencia-inicio "2025-01-16"

      # Terceiro item do blueprint sob RFB (contexto.md, seção 4.1: "Soluções
      # de Consulta COSIT, Atos Declaratórios Executivos e Tabela de
      # NCM/TIPI") — a TIPI já foi resolvida à parte (Postgres, não Qdrant).
      # Reaproveita 100% do parser/scraper da RFB: tipo_ato=9 (ADE), a única
      # diferença do passo anterior. Confirmado contra o SIJUT2 real em
      # 2026-07-27: a faceta "Tipo do ato" devolvida já mostra "Ato
      # Declaratório Executivo". Termo estreito, mesma razão do passo anterior.
      - name: Executar pipeline de ingestão (RFB — Atos Declaratórios Executivos)
        if: ${{ inputs.fonte == 'rfb_ade' }}
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          python -m ingestion.pipeline run \
            --fonte rfb \
            --termo-busca "IBS" \
            --tipo-ato "9" \
            --url "http://normas.receita.fazenda.gov.br/sijut2consulta/consulta.action" \
            --documento-id "RFB_ADE_IBS" \
            --titulo "Atos Declaratórios Executivos RFB — IBS" \
            --esfera "FEDERAL_CBS" \
            --data-vigencia-inicio "2025-01-16"

      - name: Verificar busca híbrida
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: python scripts/verificar_busca_hibrida.py

      # Diagnóstico pontual (.claude/sdd/features/DEFINE_LC_227_2026_ATUALIZACAO_LEGAL.md):
      # só leitura, decide se o corpus já indexado reflete a LC 227/2026 antes de
      # qualquer decisão de reingestão. Não reprova o job — é informativo, para leitura
      # humana, não um critério de aceite desta feature.
      - name: "Diagnóstico: corpus reflete a LC 227/2026?"
        if: ${{ inputs.verificar_lc227 == 'sim' }}
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: python scripts/verificar_lc227_ingerida.py

      - name: Limpar credenciais
        if: always()
        run: rm -f /tmp/gcp-key.json
